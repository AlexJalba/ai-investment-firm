name: Eval (manual)

on:
  workflow_dispatch:
    inputs:
      start_date:
        description: "Start date (YYYY-MM-DD)"
        required: false
        default: "2024-10-31"
      end_date:
        description: "End date (YYYY-MM-DD)"
        required: false
        default: "2024-10-31"
      tickers:
        description: "Comma-separated tickers"
        required: false
        default: "AAPL,MSFT,GOOGL,AMZN,NVDA"

jobs:
  eval:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Pre-seed RAG store from bundled news
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          python - <<'EOF'
          import os, json
          os.environ.setdefault("ANTHROPIC_API_KEY", os.environ["ANTHROPIC_API_KEY"])
          from eval.data_loader import load_news
          from src.rag.store import RAGStore
          store = RAGStore()
          articles = load_news()
          count = store.ingest(articles)
          print(f"Ingested {count} articles into RAG store")
          EOF

      - name: Run eval harness
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          TICKERS=$(echo "${{ github.event.inputs.tickers }}" | tr ',' ' ')
          python -m src.cli eval $TICKERS \
            --start "${{ github.event.inputs.start_date }}" \
            --end   "${{ github.event.inputs.end_date }}"

      - name: Upload eval report
        uses: actions/upload-artifact@v4
        with:
          name: eval-report
          path: data/eval/

      - name: Print eval summary
        run: |
          python - <<'EOF'
          import json
          from pathlib import Path
          p = Path("data/eval/eval_report.json")
          if p.exists():
              r = json.loads(p.read_text())
              print(f"\n{'='*50}")
              print(f"EVAL RESULTS  {r['period']['start']} → {r['period']['end']}")
              print(f"{'='*50}")
              print(f"Portfolio return : {r['portfolio_return_pct']:+.2f}%")
              print(f"Benchmark (SPY)  : {r['benchmark_return_pct']:+.2f}%")
              print(f"Alpha            : {r['alpha_pct']:+.2f}%")
              print(f"Grounding score  : {r['grounding_score']:.1%}")
              print(f"{'='*50}\n")
          EOF
